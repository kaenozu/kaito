[project]
name = "kaito"
version = "0.10.0"
description = "アーカイブ解凍・圧縮ツール - GUI decompression/compression tool"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2",
    "pillow>=12.2.0",
    "platformdirs>=4.10.0",
    "tkinterdnd2>=0.4.4.1",
]

[project.scripts]
kaito = "kaito.gui.unzip_app:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]

[tool.ruff]
target-version = "py312"

[tool.coverage.run]
omit = ["src/kaito/__main__.py"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]