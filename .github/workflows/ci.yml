name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify bundled 7-Zip checksums
        shell: pwsh
        run: |
          $failed = $false
          $diagnostics = @()
          Get-Content bundled/SHA256SUMS | ForEach-Object {
            if ($_ -match '^([0-9a-f]{64})\s+(.+)$') {
              $expected = $Matches[1]
              $name = $Matches[2].Trim()
              $path = Join-Path bundled $name
              if (-not (Test-Path $path)) {
                $diagnostics += "MISSING expected=$expected file=$name"
                $failed = $true
              } else {
                $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
                $diagnostics += "$actual  $name  expected=$expected"
                if ($actual -ne $expected) { $failed = $true }
              }
            }
          }
          $diagnostics | Tee-Object -FilePath bundled-actual-sha256.txt
          if ($failed) { throw 'Bundled 7-Zip checksum verification failed' }

      - name: Lint
        run: uv run ruff check .

      - name: Capture required Ruff formatting
        shell: pwsh
        run: |
          uv run ruff format .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- . | Out-File ruff-format.diff -Encoding utf8

      - name: Type check
        run: uv run pyright

      - name: Test
        shell: pwsh
        run: |
          $output = & uv run pytest -ra --junitxml=test-results.xml 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath pytest-output.txt
          exit $code

      - name: Build executable
        run: uv run pyinstaller --clean --noconfirm build.spec

      - name: Smoke-test executable and bundled backend
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/kaito.exe'
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^kaito ') { throw "Version check failed: $version" }
          $selfTest = & $exe --self-test 2>&1
          if ($LASTEXITCODE -ne 0 -or $selfTest -notmatch 'All checks passed') { throw "Self-test failed: $selfTest" }
          $json = (& $exe --backend-info --json) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "backend-info failed: $json" }
          $info = $json | ConvertFrom-Json
          if (-not $info.available) { throw 'Bundled backend unavailable' }
          if ($info.source -ne 'bundled') { throw "Unexpected backend source: $($info.source)" }
          if ($info.version -ne '26.02') { throw "Unexpected 7-Zip version: $($info.version)" }
          if ($info.integrity -ne 'ok' -or $info.sha256 -ne $info.expected_sha256) { throw 'Bundled backend integrity failed' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc 'installer/kaito.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $installer = Get-ChildItem 'dist/kaito-installer-*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Installer output not found' }
          "KAITO_INSTALLER=$($installer.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Test install, registry integration, and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'kaito 検証 installed'
          $installLog = Join-Path $env:RUNNER_TEMP 'kaito-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'kaito-uninstall.log'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$installDir`"", "/LOG=`"$installLog`"")
          $install = Start-Process $env:KAITO_INSTALLER -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }

          $installedExe = Join-Path $installDir 'kaito.exe'
          foreach ($required in @($installedExe, (Join-Path $installDir 'SECURITY.md'), (Join-Path $installDir 'THIRD_PARTY_NOTICES.md'), (Join-Path $installDir 'licenses/7-ZIP-LICENSE.txt'), (Join-Path $installDir 'licenses/SHA256SUMS'))) {
            if (-not (Test-Path $required)) { throw "Installed file missing: $required" }
          }
          $selfTest = & $installedExe --self-test 2>&1
          if ($LASTEXITCODE -ne 0 -or $selfTest -notmatch 'All checks passed') { throw "Installed self-test failed: $selfTest" }
          $info = ((& $installedExe --backend-info --json) -join "`n") | ConvertFrom-Json
          if ($info.source -ne 'bundled' -or $info.integrity -ne 'ok') { throw 'Installed backend validation failed' }

          $extractKeys = @('.zip', '.rar', '.7z') | ForEach-Object { "HKCU:\Software\Classes\SystemFileAssociations\$_\shell\kaito_extract" }
          foreach ($key in $extractKeys) { if (-not (Test-Path $key)) { throw "Context-menu key missing: $key" } }
          if (Test-Path 'HKCU:\Software\Classes\SystemFileAssociations\.txt\shell\kaito_extract') { throw 'Extract action must not be registered for .txt' }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstallArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$uninstallLog`"")
          $uninstall = Start-Process $uninstaller -ArgumentList $uninstallArgs -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 2
          foreach ($key in $extractKeys) { if (Test-Path $key) { throw "Context-menu key remained: $key" } }
          if (Test-Path $installDir) {
            $remaining = Get-ChildItem $installDir -Force -ErrorAction SilentlyContinue
            if ($remaining) { throw "Install directory not cleaned: $installDir" }
          }
          "KAITO_INSTALL_LOG=$installLog" | Out-File $env:GITHUB_ENV -Append
          "KAITO_UNINSTALL_LOG=$uninstallLog" | Out-File $env:GITHUB_ENV -Append

      - name: Require committed formatting
        shell: pwsh
        run: |
          if ((Get-Item ruff-format.diff).Length -gt 3) { throw 'Ruff formatting changes must be committed; see ruff-format.diff' }

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kaito-windows-verification
          if-no-files-found: warn
          path: |
            bundled-actual-sha256.txt
            ruff-format.diff
            pytest-output.txt
            test-results.xml
            dist/kaito.exe
            dist/kaito-installer-*.exe
            ${{ env.KAITO_INSTALL_LOG }}
            ${{ env.KAITO_UNINSTALL_LOG }}
