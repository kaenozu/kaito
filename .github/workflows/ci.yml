name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Prepare artifacts directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path artifacts -Force | Out-Null

      - name: Verify pinned 7-Zip source package identity
        shell: pwsh
        run: |
          $pinned = Get-Content 'bundled/7zip-pinned.json' -Raw | ConvertFrom-Json
          $url = $pinned.package_url
          $expected = $pinned.package_sha256
          $package = Join-Path $env:RUNNER_TEMP ([System.IO.Path]::GetFileName($url))
          Invoke-WebRequest -Uri $url -OutFile $package -UseBasicParsing
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $expected) { throw "7-Zip source package hash mismatch: $hash" }
          $signature = Get-AuthenticodeSignature $package
          @(
            "Source: $url"
            "Authenticode: $($signature.Status)"
            "SHA-256: $hash"
          ) | Set-Content 'artifacts/7zip-source-package.txt' -Encoding utf8
          Get-Content 'artifacts/7zip-source-package.txt'

      - name: Verify bundled 7-Zip checksums
        shell: pwsh
        run: |
          $failed = $false
          $diagnostics = @()
          Get-Content bundled/SHA256SUMS | ForEach-Object {
            if ($_ -match '^([0-9a-f]{64})\s+(.+)$') {
              $expected = $Matches[1]
              $name = $Matches[2].Trim()
              $path = Join-Path bundled $name
              if (-not (Test-Path $path -PathType Leaf)) {
                $diagnostics += "MISSING expected=$expected file=$name"
                $failed = $true
              } else {
                $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
                $diagnostics += "$actual  $name  expected=$expected"
                if ($actual -ne $expected) { $failed = $true }
              }
            }
          }
          $diagnostics | Tee-Object -FilePath artifacts/bundled-actual-sha256.txt
          if ($failed) { throw 'Bundled 7-Zip checksum verification failed' }

      - name: Lint
        shell: pwsh
        run: |
          $output = & uv run --frozen ruff check . 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/ruff-check.txt
          exit $code

      - name: Format check
        shell: pwsh
        run: |
          $output = & uv run --frozen ruff format --check --diff . 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/ruff-format.diff
          exit $code

      - name: Type check
        shell: pwsh
        run: |
          $output = & uv run --frozen pyright 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/pyright-output.txt
          exit $code

      - name: Test
        shell: pwsh
        run: |
          $output = & uv run --frozen pytest -ra --junitxml=artifacts/test-results.xml 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/pytest-output.txt
          exit $code

      - name: Build executable
        run: uv run --frozen pyinstaller --clean --noconfirm build.spec

      - name: Smoke-test executable and bundled backend
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/kaito.exe').Path
          $versionFile = (Resolve-Path artifacts).Path + '\kaito-version.txt'
          $selfTestFile = (Resolve-Path artifacts).Path + '\kaito-self-test.txt'
          $backendFile = (Resolve-Path artifacts).Path + '\kaito-backend.json'
          $archiveSmokeFile = (Resolve-Path artifacts).Path + '\kaito-archive-smoke.json'
          $diagnosticsFile = (Resolve-Path artifacts).Path + '\kaito-diagnostics.json'

          $process = Start-Process -FilePath $exe -ArgumentList @('--version', '--output', $versionFile) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $versionFile)) { throw "Version command failed: $($process.ExitCode)" }
          $version = Get-Content $versionFile -Raw
          $projectVersion = uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($version.Trim() -ne "kaito $projectVersion") { throw "Version check failed: $version" }

          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--output', $selfTestFile) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $selfTestFile)) { throw "Self-test process failed: $($process.ExitCode)" }
          $selfTest = Get-Content $selfTestFile -Raw
          if ($selfTest -notmatch 'All checks passed') { throw "Self-test failed: $selfTest" }

          $process = Start-Process -FilePath $exe -ArgumentList @('--backend-info', '--json', '--output', $backendFile) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $backendFile)) { throw "backend-info process failed: $($process.ExitCode)" }
          $info = Get-Content $backendFile -Raw | ConvertFrom-Json
          if (-not $info.available) { throw 'Bundled backend unavailable' }
          if ($info.source -ne 'bundled') { throw "Unexpected backend source: $($info.source)" }
          if ($info.version -ne '26.02') { throw "Unexpected 7-Zip version: $($info.version)" }
          if ($info.integrity -ne 'ok' -or $info.sha256 -ne $info.expected_sha256) { throw 'Bundled backend integrity failed' }

          $process = Start-Process -FilePath $exe -ArgumentList @('--archive-smoke', '--json', '--output', $archiveSmokeFile) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $archiveSmokeFile)) {
            $text = if (Test-Path $archiveSmokeFile) { Get-Content $archiveSmokeFile -Raw } else { '<missing output>' }
            throw "Archive smoke process failed: exit=$($process.ExitCode) output=$text"
          }
          $archiveSmoke = Get-Content $archiveSmokeFile -Raw | ConvertFrom-Json
          if ($archiveSmoke.failed -ne 0 -or $archiveSmoke.passed -ne 6) {
            throw "Archive smoke verification failed: $($archiveSmoke | ConvertTo-Json -Depth 8 -Compress)"
          }

          $process = Start-Process -FilePath $exe -ArgumentList @('--diagnostics', '--output', $diagnosticsFile) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $diagnosticsFile)) { throw 'Diagnostics command failed' }
          $diagnostics = Get-Content $diagnosticsFile -Raw | ConvertFrom-Json
          if ($diagnostics.application.version -ne $projectVersion) { throw 'Diagnostics version mismatch' }
          if ($diagnostics.backend.integrity -ne 'ok') { throw 'Diagnostics backend verification failed' }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          "ISCC_PATH=$iscc" | Out-File $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        run: |
          & $env:ISCC_PATH 'installer/kaito.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $installer = Get-ChildItem 'dist/kaito-installer-*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $installer) { throw 'Installer output not found' }
          "KAITO_INSTALLER=$($installer.FullName)" | Out-File $env:GITHUB_ENV -Append
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content artifacts/installer-sha256.txt -Encoding ascii

      - name: Record build artifact checksums
        shell: pwsh
        run: |
          $files = @(
            (Resolve-Path 'dist/kaito.exe').Path,
            (Resolve-Path $env:KAITO_INSTALLER).Path
          )
          $lines = foreach ($file in $files) {
            $item = Get-Item $file
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($item.Name)  $($item.Length) bytes"
          }
          $lines | Set-Content artifacts/build-sha256.txt -Encoding ascii
          Get-Content artifacts/build-sha256.txt

      - name: Smoke-test acceptance preparation and evidence collection
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'kaito-acceptance-helper'
          $evidence = Join-Path (Resolve-Path artifacts).Path 'acceptance-helper'
          ./tools/prepare_acceptance.ps1 `
            -ArtifactRoot . `
            -RepositoryRoot . `
            -WorkRoot $work `
            -EvidenceRoot $evidence `
            -LargeFileSizeMB 1
          ./tools/collect_acceptance_evidence.ps1 `
            -Phase Before `
            -RepositoryRoot . `
            -EvidenceRoot $evidence `
            -WorkRoot $work

      - name: Test install, registry integration, and uninstall
        shell: pwsh
        run: ./tools/test_installer.ps1 -InstallerPath $env:KAITO_INSTALLER -ArtifactsDir artifacts

      - name: Verify tracked files remain unchanged
        shell: pwsh
        run: |
          $status = @(& git status --porcelain --untracked-files=no)
          $status | Set-Content artifacts/tracked-status.txt -Encoding utf8
          & git diff -- . | Set-Content artifacts/tracked-diff.patch -Encoding utf8
          if ($status.Count -gt 0) {
            $status | ForEach-Object { Write-Error "Tracked file changed during verification: $_" }
            throw 'Verification mutated tracked repository files.'
          }

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaito-windows-verification
          if-no-files-found: warn
          path: |
            artifacts/
            dist/kaito.exe
            dist/kaito-installer-*.exe
