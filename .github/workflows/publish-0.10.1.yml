name: Publish kaito v0.10.1

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-0.10.1.yml

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  publish-verified-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 9459c393d3b189ebde4a547cdca0321671c5b4e0
          fetch-depth: 0

      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 29190697300 \
            --repo "$GITHUB_REPOSITORY" \
            --name kaito-windows-verification \
            --dir release-artifact

      - name: Verify artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < release-artifact/artifacts/kaito-version.txt)" = "kaito 0.10.1"

          exe='release-artifact/dist/kaito.exe'
          installer='release-artifact/dist/kaito-installer-0.10.1.exe'
          test -f "$exe"
          test -f "$installer"

          exe_hash="$(sha256sum "$exe" | cut -d' ' -f1)"
          installer_hash="$(sha256sum "$installer" | cut -d' ' -f1)"

          test "$exe_hash" = '5b90e145d28c836b39aaba98798ac209b81b3a8d414bf04e45628aa0e8d7da83'
          test "$installer_hash" = 'd39a2011d1be7477f15315c6f3812751ba6b8fcaf7d11dbc8632880544deea46'

          grep -F '5b90e145d28c836b39aaba98798ac209b81b3a8d414bf04e45628aa0e8d7da83  kaito.exe  23081463 bytes' release-artifact/artifacts/release-sha256.txt
          grep -F 'd39a2011d1be7477f15315c6f3812751ba6b8fcaf7d11dbc8632880544deea46  kaito-installer-0.10.1.exe  24691071 bytes' release-artifact/artifacts/release-sha256.txt
          grep -F '"failed": 0' release-artifact/artifacts/kaito-archive-smoke.json
          grep -F '"passed": 6' release-artifact/artifacts/kaito-archive-smoke.json

          printf '%s  %s\n' "$exe_hash" 'kaito.exe' > release-artifact/dist/SHA256SUMS
          printf '%s  %s\n' "$installer_hash" 'kaito-installer-0.10.1.exe' >> release-artifact/dist/SHA256SUMS
          cat release-artifact/dist/SHA256SUMS

      - name: Create or verify stable tag
        shell: bash
        run: |
          set -euo pipefail
          target='9459c393d3b189ebde4a547cdca0321671c5b4e0'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --tags origin refs/tags/v0.10.1 >/dev/null 2>&1; then
            git fetch origin refs/tags/v0.10.1:refs/tags/v0.10.1
            actual="$(git rev-list -n 1 v0.10.1)"
            test "$actual" = "$target"
          else
            git tag -a v0.10.1 "$target" -m 'kaito 0.10.1'
            git push origin v0.10.1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.10.1
          name: kaito v0.10.1
          generate_release_notes: true
          files: |
            release-artifact/dist/kaito.exe
            release-artifact/dist/kaito-installer-0.10.1.exe
            release-artifact/dist/SHA256SUMS

      - name: Record completed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checksums="$(cat release-artifact/dist/SHA256SUMS)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(cat <<EOF
          ## v0.10.1 release completed

          Stable tag and GitHub Release were published successfully from commit \`9459c393d3b189ebde4a547cdca0321671c5b4e0\` using the fully verified PR #7 artifact.

          \`\`\`text
          $checksums
          \`\`\`

          Workflow: $run_url
          EOF
          )
          gh issue comment 6 --repo "$GITHUB_REPOSITORY" --body "$body"
