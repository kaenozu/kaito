name: Format GUI once

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/archive-redesign

      - name: Apply guarded Ruff formatting
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/kaito/gui/unzip_app.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''                max_single_file_size=int(
                    self._settings.get("safety_max_file_size")
                ),
''',
                  '''                max_single_file_size=int(self._settings.get("safety_max_file_size")),
''',
              ),
              (
                  '''                max_path_length=int(
                    self._settings.get("safety_max_path_length")
                ),
''',
                  '''                max_path_length=int(self._settings.get("safety_max_path_length")),
''',
              ),
          ]
          changed = False
          for old, new in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new, 1)
                  changed = True
              elif count != 0:
                  raise SystemExit(f"expected at most one guarded match, found {count}: {old!r}")
          path.write_text(text, encoding="utf-8", newline="\n")
          print(f"changed={changed}")

      - name: Commit formatting patch when needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kaito/gui/unzip_app.py
          if git diff --cached --quiet; then
            echo "Formatting already applied."
            exit 0
          fi
          git diff --cached --check
          git commit -m "style: apply Ruff formatting to GUI safety settings"
          git push origin HEAD:feature/archive-redesign
