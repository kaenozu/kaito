name: Apply archive productivity integration

on:
  push:
    branches:
      - agent/archive-productivity-suite
    paths:
      - .github/workflows/apply-productivity-patches.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Patch existing integration points
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # ZIP integrity test.
          replace_once(
              "src/kaito/archive/zip_backend.py",
              "from kaito.archive.safety import (\n",
              "from kaito.archive.inspection import IntegrityCheckResult\nfrom kaito.archive.safety import (\n",
          )
          replace_once(
              "src/kaito/archive/zip_backend.py",
              "    def check_tool_availability(self) -> tuple[bool, str | None]:\n        return True, None\n",
              '''    def test_archive(\n        self, path: Path, password: Optional[str] = None\n    ) -> IntegrityCheckResult:\n        """Read every ZIP member and verify CRC values without extracting."""\n        self._check_cancelled()\n\n        def verify(archive: zipfile.ZipFile) -> IntegrityCheckResult:\n            if password is not None:\n                archive.setpassword(password.encode("utf-8"))\n            checked = 0\n            for info in archive.infolist():\n                self._check_cancelled()\n                if info.is_dir():\n                    continue\n                try:\n                    with archive.open(info, "r") as source:\n                        while source.read(self._IO_CHUNK_SIZE):\n                            self._check_cancelled()\n                except RuntimeError as exc:\n                    message = str(exc).lower()\n                    if "password" in message or "pwd" in message:\n                        raise InvalidPasswordError(str(path)) from exc\n                    raise\n                checked += 1\n            return IntegrityCheckResult(\n                status="passed",\n                checked_entries=checked,\n                message=f"整合性検査に成功しました（{checked}ファイル、CRCエラーなし）",\n            )\n\n        try:\n            return self._try_zip_with_encodings(path, verify)\n        except InvalidPasswordError:\n            raise\n        except (zipfile.BadZipFile, OSError, RuntimeError) as exc:\n            return IntegrityCheckResult(\n                status="failed",\n                checked_entries=0,\n                message=f"ZIP整合性検査に失敗しました: {exc}",\n            )\n\n    def check_tool_availability(self) -> tuple[bool, str | None]:\n        return True, None\n''',
          )

          # 7-Zip integrity test and AES-256 ZIP creation.
          replace_once(
              "src/kaito/archive/sevenzip_backend.py",
              "from kaito.archive.safety import (\n",
              "from kaito.archive.inspection import IntegrityCheckResult\nfrom kaito.archive.safety import (\n",
          )
          replace_once(
              "src/kaito/archive/sevenzip_backend.py",
              '    def supports_creation(self, extension: str) -> bool:\n        return extension.lower() == ".7z"\n',
              '    def supports_creation(self, extension: str) -> bool:\n        return extension.lower() in {".7z", ".zip"}\n',
          )
          replace_once(
              "src/kaito/archive/sevenzip_backend.py",
              '''            arguments = ["a", f"-mx={seven_zip_level}", str(temporary_output)]\n            if options.password:\n                arguments.append("-mhe=on")\n            arguments.extend(str(source) for source in options.sources)\n''',
              '''            arguments = ["a", f"-mx={seven_zip_level}"]\n            if extension == ".zip":\n                arguments.extend(["-tzip", "-mem=AES256"] if options.password else ["-tzip"])\n            elif options.password:\n                arguments.append("-mhe=on")\n            arguments.append(str(temporary_output))\n            arguments.extend(str(source) for source in options.sources)\n''',
          )
          replace_once(
              "src/kaito/archive/sevenzip_backend.py",
              "    def read_entry(\n",
              '''    def test_archive(\n        self, path: Path, password: Optional[str] = None\n    ) -> IntegrityCheckResult:\n        """Run the 7-Zip test command without writing extracted files."""\n        self._check_cancelled()\n        info = self.list_archive(path, password=password)\n        result = self._run_7z(["t", str(path)], password=password, timeout=3600)\n        if result.returncode != 0:\n            self._raise_archive_error(path, password, result)\n        checked = sum(1 for entry in info.entries if entry.is_file)\n        return IntegrityCheckResult(\n            status="passed",\n            checked_entries=checked,\n            message=f"整合性検査に成功しました（{checked}ファイル、データエラーなし）",\n        )\n\n    def read_entry(\n''',
          )

          # Settings for update notifications.
          replace_once(
              "src/kaito/settings.py",
              '    "compression_level": 1,\n',
              '    "compression_level": 1,\n    "check_updates": True,\n    "last_update_check": 0,\n',
          )
          replace_once(
              "src/kaito/settings.py",
              '    for key in ("open_on_done", "close_on_done"):\n',
              '    for key in ("open_on_done", "close_on_done", "check_updates"):\n',
          )
          replace_once(
              "src/kaito/settings.py",
              '    defaults["recent_files"] = _validate_recent_files(data.get("recent_files"))\n',
              '''    defaults["recent_files"] = _validate_recent_files(data.get("recent_files"))\n    last_update_check = data.get("last_update_check")\n    defaults["last_update_check"] = (\n        last_update_check\n        if isinstance(last_update_check, int)\n        and not isinstance(last_update_check, bool)\n        and last_update_check >= 0\n        else 0\n    )\n''',
          )

          # Install GUI controller and pass compression password through.
          replace_once(
              "src/kaito/gui/unzip_app.py",
              "from kaito.gui.settings_dialog import SettingsDialog\n",
              "from kaito.gui.productivity import ProductivityFeatures\nfrom kaito.gui.settings_dialog import SettingsDialog\n",
          )
          replace_once(
              "src/kaito/gui/unzip_app.py",
              "        self._build_ui()\n\n        self._apply_tree_style()\n",
              "        self._build_ui()\n        self._productivity = ProductivityFeatures(self)\n\n        self._apply_tree_style()\n",
          )
          replace_once(
              "src/kaito/gui/unzip_app.py",
              '''                archive_destination = ArchiveService.resolve_extract_dest(\n                    base_destination, archive_path, info.entries\n                )\n''',
              '''                archive_destination = ArchiveService.resolve_extract_dest(\n                    base_destination, archive_path, info.entries, avoid_existing=True\n                )\n''',
          )
          replace_once(
              "src/kaito/gui/unzip_app.py",
              '''                compression_level=compression_level,\n                on_progress=on_progress,\n''',
              '''                compression_level=compression_level,\n                password=getattr(self, "_compress_password", None),\n                on_progress=on_progress,\n''',
          )
          replace_once(
              "src/kaito/gui/unzip_app.py",
              "        self._compress_sources = []\n        close_after = self._compress_no_dialog\n",
              "        self._compress_sources = []\n        self._compress_password = None\n        close_after = self._compress_no_dialog\n",
          )
          replace_once(
              "src/kaito/gui/unzip_app.py",
              "        self._compress_sources = []\n        self._compress_no_dialog = False\n        self._set_ui_enabled(True)\n",
              "        self._compress_sources = []\n        self._compress_password = None\n        self._compress_no_dialog = False\n        self._set_ui_enabled(True)\n",
          )
          replace_once(
              "src/kaito/gui/unzip_app.py",
              "        if self._compress_no_dialog:\n            self._compress_no_dialog = False\n",
              "        self._compress_password = None\n        if self._compress_no_dialog:\n            self._compress_no_dialog = False\n",
          )

          # Settings toggle.
          replace_once(
              "src/kaito/gui/settings_dialog.py",
              '        self.geometry("400x285")\n',
              '        self.geometry("400x350")\n',
          )
          replace_once(
              "src/kaito/gui/settings_dialog.py",
              '''        button_frame = ctk.CTkFrame(self, fg_color="transparent")\n        button_frame.grid(row=4, column=0, padx=24, pady=(12, 20), sticky="e")\n''',
              '''        update_frame = ctk.CTkFrame(self)\n        update_frame.grid(row=4, column=0, padx=24, pady=4, sticky="ew")\n        self._update_var = ctk.BooleanVar(\n            value=bool(self._settings.get("check_updates", True))\n        )\n        ctk.CTkCheckBox(\n            update_frame,\n            text="起動時に更新を確認する",\n            variable=self._update_var,\n        ).grid(row=0, column=0, padx=12, pady=10, sticky="w")\n\n        button_frame = ctk.CTkFrame(self, fg_color="transparent")\n        button_frame.grid(row=5, column=0, padx=24, pady=(12, 20), sticky="e")\n''',
          )
          replace_once(
              "src/kaito/gui/settings_dialog.py",
              '''            theme=theme,\n            compression_level=self._compression_level(),\n''',
              '''            theme=theme,\n            compression_level=self._compression_level(),\n            check_updates=self._update_var.get(),\n''',
          )

      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kaito
          git commit -m "Integrate archive productivity features"
          git push origin "HEAD:${GITHUB_REF_NAME}"
