name: Create v0.12.0 tag

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/create-v0.12.0-tag.yml

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged master commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create immutable v0.12.0 tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as stream:
              print(tomllib.load(stream)['project']['version'])
          PY
          )"
          if [[ "$version" != '0.12.0' ]]; then
            echo "Unexpected project version: $version" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.12.0 >/dev/null 2>&1; then
            echo 'v0.12.0 already exists; refusing to move or recreate it.' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.12.0 -m "kaito v0.12.0" "$GITHUB_SHA"
          git push origin refs/tags/v0.12.0
