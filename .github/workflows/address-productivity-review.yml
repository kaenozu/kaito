name: Address productivity review feedback

on:
  push:
    branches:
      - agent/archive-productivity-suite
    paths:
      - .github/workflows/address-productivity-review.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/kaito/context_menu.py",
              '''        from winreg import (  # type: ignore[attr-defined]\n            DeleteKey,\n            EnumKey,\n            KEY_SET_VALUE,\n            OpenKey,\n            QueryInfoKey,\n        )\n''',
              '''        from winreg import (  # type: ignore[attr-defined]\n            DeleteKey,\n            EnumKey,\n            KEY_ALL_ACCESS,\n            OpenKey,\n            QueryInfoKey,\n        )\n''',
          )
          replace_once(
              "src/kaito/context_menu.py",
              "        with OpenKey(root_key, sub_key, 0, KEY_SET_VALUE) as key:\n",
              "        with OpenKey(root_key, sub_key, 0, KEY_ALL_ACCESS) as key:\n",
          )

          diagnostics = Path("src/kaito/diagnostics.py")
          text = diagnostics.read_text(encoding="utf-8")
          start = text.index("def _sanitize_error(message: str) -> str:\n")
          replacement = '''def _sanitize_error(message: str) -> str:\n    """Avoid copying likely file paths or command-line secrets into reports."""\n    pieces: list[str] = []\n    in_password = False\n    quote_character = ""\n    for token in message.replace("\\r", " ").replace("\\n", " ").split():\n        lower = token.lower()\n        if in_password:\n            if quote_character and token.endswith(quote_character):\n                in_password = False\n                quote_character = ""\n            continue\n\n        if lower.startswith("-p") and len(token) > 2:\n            value = token[2:]\n            pieces.append("-p***")\n            if value.startswith(("\\\"", "'")):\n                quote_character = value[0]\n                if not (len(value) > 1 and value.endswith(quote_character)):\n                    in_password = True\n            continue\n\n        if lower.startswith("--password="):\n            value = token.split("=", 1)[1]\n            pieces.append("--password=***")\n            if value.startswith(("\\\"", "'")):\n                quote_character = value[0]\n                if not (len(value) > 1 and value.endswith(quote_character)):\n                    in_password = True\n            continue\n\n        if ":\\\\" in token or token.startswith("/") or token.startswith("\\\\\\\\"):\n            pieces.append("<path>")\n        else:\n            pieces.append(token)\n    return " ".join(pieces)[:1000]\n'''
          diagnostics.write_text(text[:start] + replacement, encoding="utf-8")

          inspection = Path("src/kaito/archive/inspection.py")
          text = inspection.read_text(encoding="utf-8")
          old = '''    selected = set(selected_names)\n    prefixes = {\n        name.rstrip("/") + "/"\n        for name in selected_names\n        if any(entry.name == name and entry.is_dir for entry in entries)\n    }\n'''
          new = '''    selected = set(selected_names)\n    directories = {entry.name.rstrip("/") for entry in entries if entry.is_dir}\n    prefixes = {\n        name.rstrip("/") + "/"\n        for name in selected_names\n        if name.rstrip("/") in directories\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit("inspection selection block not found")
          inspection.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/kaito/gui/productivity.py",
              '''        selected_entries = [\n            entry for entry in self.app._entries if entry.name in set(members)\n        ]\n''',
              '''        selected_member_names = set(members)\n        selected_entries = [\n            entry\n            for entry in self.app._entries\n            if entry.name in selected_member_names\n        ]\n''',
          )

          replace_once(
              "tools/sign_windows.ps1",
              "$PfxPath = Join-Path $env:RUNNER_TEMP ('kaito-signing-' + [guid]::NewGuid() + '.pfx')\n",
              '''$TempDir = if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {\n    [System.IO.Path]::GetTempPath()\n}\nelse {\n    $env:RUNNER_TEMP\n}\n$PfxPath = Join-Path $TempDir ('kaito-signing-' + [guid]::NewGuid() + '.pfx')\n''',
          )

          test_path = Path("tests/test_productivity_services.py")
          text = test_path.read_text(encoding="utf-8")
          marker = '''    assert "-p***" in report["last_error"]\n'''
          if text.count(marker) != 1:
              raise SystemExit("diagnostic assertion marker not found")
          extra = '''    assert "-p***" in report["last_error"]\n\n\ndef test_diagnostic_report_redacts_quoted_password_arguments(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    service = ArchiveService()\n    monkeypatch.setattr(\n        service,\n        "backend_info",\n        lambda: {\n            "available": True,\n            "source": "bundled",\n            "version": "26.02",\n            "integrity": "ok",\n            "sha256": "same",\n            "expected_sha256": "same",\n        },\n    )\n\n    report_text = build_diagnostic_report(\n        service,\n        last_error='7z failed -p"my secret password" --password=\'another secret\' remaining',\n    )\n    report = json.loads(report_text)\n\n    assert "my secret password" not in report_text\n    assert "another secret" not in report_text\n    assert "-p***" in report["last_error"]\n    assert "--password=***" in report["last_error"]\n    assert "remaining" in report["last_error"]\n'''
          test_path.write_text(text.replace(marker, extra, 1), encoding="utf-8")

      - name: Format and lint
        run: |
          python -m pip install ruff==0.15.16
          ruff format src tests
          ruff check src tests

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests tools/sign_windows.ps1
          git commit -m "Address archive productivity review feedback"
          git push origin "HEAD:${GITHUB_REF_NAME}"
