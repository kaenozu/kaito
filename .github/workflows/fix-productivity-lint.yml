name: Apply focused productivity lint fix

on:
  push:
    branches:
      - agent/archive-productivity-suite
    paths:
      - .github/workflows/fix-productivity-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Remove unused import
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/kaito/gui/productivity.py")
          text = path.read_text(encoding="utf-8")
          old = "from kaito.domain.models import ArchiveEntry, ArchiveInfo, ExtractionOptions\n"
          new = "from kaito.domain.models import ArchiveInfo, ExtractionOptions\n"
          if text.count(old) != 1:
              raise SystemExit("expected import was not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kaito/gui/productivity.py
          git commit -m "Remove unused productivity import"
          git push origin "HEAD:${GITHUB_REF_NAME}"
