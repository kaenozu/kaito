name: Release rehearsal

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/release-rehearsal.yml"
      - ".github/workflows/release.yml"
      - "build.spec"
      - "installer/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "bundled/**"
      - "tools/sign_windows.ps1"
      - "tools/generate_sbom.py"
      - "tools/test_installer.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-rehearsal-package:
    runs-on: windows-latest
    timeout-minutes: 50
    outputs:
      version: ${{ steps.release-context.outputs.version }}
      rehearsal_tag: ${{ steps.release-context.outputs.rehearsal_tag }}
      commit: ${{ steps.release-context.outputs.commit }}
      expected_manifest: ${{ steps.package-manifest.outputs.expected_manifest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Prepare rehearsal context
        id: release-context
        shell: pwsh
        run: |
          $version = uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Unable to determine project version.' }
          $rehearsalTag = "rehearsal-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "KAITO_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          "KAITO_REHEARSAL_TAG=$rehearsalTag" | Out-File $env:GITHUB_ENV -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "rehearsal_tag=$rehearsalTag" | Out-File $env:GITHUB_OUTPUT -Append
          "commit=$env:GITHUB_SHA" | Out-File $env:GITHUB_OUTPUT -Append
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null

      - name: Verify bundled 7-Zip checksums
        shell: pwsh
        run: |
          Get-Content bundled/SHA256SUMS | ForEach-Object {
            if ($_ -notmatch '^([0-9a-f]{64})\s+(.+)$') { throw "Invalid bundled checksum line: $_" }
            $expected = $Matches[1]
            $name = $Matches[2].Trim()
            $path = Join-Path bundled $name
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing bundled file: $path" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Hash mismatch for ${path}: $actual" }
            "$actual  $name" | Add-Content artifacts/bundled-sha256.txt -Encoding ascii
          }

      - name: Create ephemeral rehearsal certificate
        shell: pwsh
        run: |
          $password = [Convert]::ToBase64String(
            [System.Security.Cryptography.RandomNumberGenerator]::GetBytes(24)
          )
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=kaito CI signing test' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -HashAlgorithm SHA256 `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddDays(2)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'kaito-release-rehearsal.pfx'
          "KAITO_TEST_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Append
          "KAITO_TEST_PFX_PATH=$pfxPath" | Out-File $env:GITHUB_ENV -Append
          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword | Out-Null
          $certificateBase64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfxPath))
          Write-Output "::add-mask::$password"
          Write-Output "::add-mask::$certificateBase64"
          "WINDOWS_CERTIFICATE_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append
          "WINDOWS_CERTIFICATE_BASE64=$certificateBase64" | Out-File $env:GITHUB_ENV -Append
          'KAITO_SIGNING_TEST=1' | Out-File $env:GITHUB_ENV -Append

      - name: Validate rehearsal signing configuration
        shell: pwsh
        run: |
          ./tools/sign_windows.ps1 `
            -Mode required `
            -ValidateOnly `
            -VerificationMode test-untrusted `
            -StatusPath 'artifacts/windows-signing-preflight.json'

      - name: Build executable
        run: uv run --frozen pyinstaller --clean --noconfirm build.spec

      - name: Require initially unsigned executable
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'dist/kaito.exe'
          if ($signature.Status -ne 'NotSigned') {
            throw "Rehearsal executable was unexpectedly signed before the signing step: $($signature.Status)"
          }

      - name: Sign executable with ephemeral certificate
        shell: pwsh
        run: |
          ./tools/sign_windows.ps1 `
            -Mode required `
            -FilePath 'dist/kaito.exe' `
            -TimestampUrl '' `
            -VerificationMode test-untrusted `
            -StatusPath 'artifacts/windows-signing-executable.json'

      - name: Smoke-test signed executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/kaito.exe').Path
          $versionFile = (Resolve-Path artifacts).Path + '\rehearsal-version.txt'
          $selfTestFile = (Resolve-Path artifacts).Path + '\rehearsal-self-test.txt'
          $backendFile = (Resolve-Path artifacts).Path + '\rehearsal-backend.json'
          $archiveSmokeFile = (Resolve-Path artifacts).Path + '\rehearsal-archive-smoke.json'
          $diagnosticsFile = (Resolve-Path artifacts).Path + '\rehearsal-diagnostics.json'

          $process = Start-Process -FilePath $exe -ArgumentList @('--version', '--output', $versionFile) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Version process failed: $($process.ExitCode)" }
          if ((Get-Content $versionFile -Raw).Trim() -ne "kaito $env:KAITO_VERSION") { throw 'Version output mismatch.' }

          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--output', $selfTestFile) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Self-test process failed: $($process.ExitCode)" }
          if ((Get-Content $selfTestFile -Raw) -notmatch 'All checks passed') { throw 'Self-test failed.' }

          $process = Start-Process -FilePath $exe -ArgumentList @('--backend-info', '--json', '--output', $backendFile) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Backend-info process failed: $($process.ExitCode)" }
          $backend = Get-Content $backendFile -Raw | ConvertFrom-Json
          if ($backend.source -ne 'bundled' -or $backend.version -ne '26.02' -or $backend.integrity -ne 'ok' -or $backend.sha256 -ne $backend.expected_sha256) {
            throw "Backend verification failed: $($backend | ConvertTo-Json -Compress)"
          }

          $process = Start-Process -FilePath $exe -ArgumentList @('--archive-smoke', '--json', '--output', $archiveSmokeFile) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $archiveSmokeFile)) { throw 'Archive smoke process failed.' }
          $archiveSmoke = Get-Content $archiveSmokeFile -Raw | ConvertFrom-Json
          if ($archiveSmoke.failed -ne 0 -or $archiveSmoke.passed -ne 6) { throw 'Archive smoke verification failed.' }

          $process = Start-Process -FilePath $exe -ArgumentList @('--diagnostics', '--output', $diagnosticsFile) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $diagnosticsFile)) { throw 'Diagnostics command failed.' }
          $diagnostics = Get-Content $diagnosticsFile -Raw | ConvertFrom-Json
          if ($diagnostics.application.version -ne $env:KAITO_VERSION -or $diagnostics.backend.integrity -ne 'ok') {
            throw 'Diagnostics verification failed.'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          "ISCC_PATH=$iscc" | Out-File $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        run: |
          & $env:ISCC_PATH "/DMyAppVersion=$env:KAITO_VERSION" 'installer/kaito.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $installer = Get-ChildItem 'dist/kaito-installer-*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $installer) { throw 'Installer output not found.' }
          $expectedInstallerName = "kaito-installer-$env:KAITO_VERSION.exe"
          if ($installer.Name -ne $expectedInstallerName) {
            throw "Installer name mismatch: expected=$expectedInstallerName actual=$($installer.Name)"
          }
          "KAITO_INSTALLER=$($installer.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Require initially unsigned installer
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature $env:KAITO_INSTALLER
          if ($signature.Status -ne 'NotSigned') {
            throw "Rehearsal installer was unexpectedly signed before the signing step: $($signature.Status)"
          }

      - name: Sign installer with ephemeral certificate
        shell: pwsh
        run: |
          ./tools/sign_windows.ps1 `
            -Mode required `
            -FilePath $env:KAITO_INSTALLER `
            -TimestampUrl '' `
            -VerificationMode test-untrusted `
            -StatusPath 'artifacts/windows-signing-installer.json'

      - name: Test signed installer and uninstall
        shell: pwsh
        run: ./tools/test_installer.ps1 -InstallerPath $env:KAITO_INSTALLER -ArtifactsDir artifacts

      - name: Generate CycloneDX runtime SBOM
        shell: pwsh
        run: |
          uv run --frozen python tools/generate_sbom.py `
            --repository-root . `
            --output dist/kaito-sbom.cdx.json `
            --commit $env:GITHUB_SHA
          Get-Content dist/kaito-sbom.cdx.json -Raw | ConvertFrom-Json | Out-Null

      - name: Generate rehearsal metadata
        shell: pwsh
        run: |
          $exeSigning = Get-Content 'artifacts/windows-signing-executable.json' -Raw | ConvertFrom-Json
          $installerSigning = Get-Content 'artifacts/windows-signing-installer.json' -Raw | ConvertFrom-Json
          if ($exeSigning.result -ne 'signed' -or $installerSigning.result -ne 'signed') {
            throw 'Both rehearsal product binaries must be signed.'
          }
          if (-not [string]::Equals(
            [string]$exeSigning.certificate.thumbprint,
            [string]$installerSigning.certificate.thumbprint,
            [System.StringComparison]::OrdinalIgnoreCase
          )) {
            throw 'Executable and installer signer thumbprints differ.'
          }
          if (-not [string]::Equals(
            [string]$exeSigning.certificate.thumbprint,
            $env:KAITO_TEST_CERT_THUMBPRINT,
            [System.StringComparison]::OrdinalIgnoreCase
          )) {
            throw 'Signing status does not match the generated rehearsal certificate.'
          }

          $assetPaths = @(
            (Resolve-Path 'dist/kaito.exe').Path,
            (Resolve-Path $env:KAITO_INSTALLER).Path,
            (Resolve-Path 'dist/kaito-sbom.cdx.json').Path
          )
          $assets = foreach ($assetPath in $assetPaths) {
            $item = Get-Item $assetPath
            [ordered]@{
              name = $item.Name
              sha256 = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
              size = $item.Length
            }
          }
          $metadata = [ordered]@{
            schema_version = 1
            rehearsal = $true
            version = $env:KAITO_VERSION
            tag = $env:KAITO_REHEARSAL_TAG
            commit = $env:GITHUB_SHA
            workflow_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            signing = [ordered]@{
              mode = 'required'
              result = 'signed'
              verification_mode = 'test-untrusted'
              certificate = $exeSigning.certificate
            }
            assets = $assets
          }
          $metadata | ConvertTo-Json -Depth 10 | Set-Content 'dist/RELEASE-METADATA.json' -Encoding utf8

      - name: Generate rehearsal checksums
        shell: pwsh
        run: |
          $files = @(
            'dist/kaito.exe',
            $env:KAITO_INSTALLER,
            'dist/kaito-sbom.cdx.json',
            'dist/RELEASE-METADATA.json'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content 'dist/SHA256SUMS' -Encoding ascii

      - name: Verify tracked files remain unchanged
        shell: pwsh
        run: |
          $status = @(& git status --porcelain --untracked-files=no)
          $status | Set-Content artifacts/tracked-status.txt -Encoding utf8
          & git diff -- . | Set-Content artifacts/tracked-diff.patch -Encoding utf8
          if ($status.Count -gt 0) {
            $status | ForEach-Object { Write-Error "Tracked file changed during rehearsal: $_" }
            throw 'Release rehearsal mutated tracked repository files.'
          }

      - name: Record expected package manifest
        id: package-manifest
        shell: pwsh
        run: |
          $files = @(
            (Resolve-Path 'dist/kaito.exe').Path,
            (Resolve-Path $env:KAITO_INSTALLER).Path,
            (Resolve-Path 'dist/kaito-sbom.cdx.json').Path,
            (Resolve-Path 'dist/RELEASE-METADATA.json').Path,
            (Resolve-Path 'dist/SHA256SUMS').Path
          )
          $manifestFiles = foreach ($file in $files) {
            $item = Get-Item $file
            [ordered]@{
              name = $item.Name
              sha256 = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
              size = $item.Length
            }
          }
          $manifest = [ordered]@{
            schema_version = 1
            version = $env:KAITO_VERSION
            tag = $env:KAITO_REHEARSAL_TAG
            commit = $env:GITHUB_SHA
            files = $manifestFiles
          }
          $manifestJson = $manifest | ConvertTo-Json -Depth 8 -Compress
          $manifestJson | Set-Content 'artifacts/rehearsal-expected-manifest.json' -Encoding utf8
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifestJson))
          "expected_manifest=$encoded" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Upload rehearsal package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaito-release-rehearsal-package
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/kaito.exe
            dist/kaito-installer-*.exe
            dist/kaito-sbom.cdx.json
            dist/RELEASE-METADATA.json
            dist/SHA256SUMS

      - name: Clean up ephemeral rehearsal certificate
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:KAITO_TEST_CERT_THUMBPRINT)) {
            Get-ChildItem "Cert:\CurrentUser\My\$env:KAITO_TEST_CERT_THUMBPRINT" -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }
          if (-not [string]::IsNullOrWhiteSpace($env:KAITO_TEST_PFX_PATH)) {
            Remove-Item $env:KAITO_TEST_PFX_PATH -Force -ErrorAction SilentlyContinue
          }

      - name: Upload rehearsal build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaito-release-rehearsal-build-evidence
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/

  verify-redownloaded-package:
    needs: build-rehearsal-package
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      KAITO_VERSION: ${{ needs.build-rehearsal-package.outputs.version }}
      KAITO_REHEARSAL_TAG: ${{ needs.build-rehearsal-package.outputs.rehearsal_tag }}
      KAITO_REHEARSAL_COMMIT: ${{ needs.build-rehearsal-package.outputs.commit }}
      KAITO_EXPECTED_MANIFEST: ${{ needs.build-rehearsal-package.outputs.expected_manifest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download rehearsal package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaito-release-rehearsal-package
          path: downloaded

      - name: Verify redownloaded release package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $package = (Resolve-Path downloaded).Path

          $expectedJson = [Text.Encoding]::UTF8.GetString(
            [Convert]::FromBase64String($env:KAITO_EXPECTED_MANIFEST)
          )
          $expectedJson | Set-Content 'artifacts/rehearsal-expected-manifest.json' -Encoding utf8
          $expectedManifest = $expectedJson | ConvertFrom-Json
          if (
            $expectedManifest.version -ne $env:KAITO_VERSION -or
            $expectedManifest.tag -ne $env:KAITO_REHEARSAL_TAG -or
            $expectedManifest.commit -ne $env:KAITO_REHEARSAL_COMMIT
          ) {
            throw 'Expected package manifest context is inconsistent.'
          }

          $expectedFiles = @($expectedManifest.files)
          if ($expectedFiles.Count -ne 5) { throw "Expected manifest must contain exactly five files, found $($expectedFiles.Count)." }
          $actualFiles = @(Get-ChildItem $package -File)
          if ($actualFiles.Count -ne 5) { throw "Downloaded package must contain exactly five files, found $($actualFiles.Count)." }
          $expectedNames = @($expectedFiles | ForEach-Object { $_.name } | Sort-Object)
          $actualNames = @($actualFiles | ForEach-Object { $_.Name } | Sort-Object)
          $nameDifference = @(Compare-Object -ReferenceObject $expectedNames -DifferenceObject $actualNames)
          if ($nameDifference.Count -gt 0) {
            throw "Downloaded package file set differs from the build manifest: $($nameDifference | Out-String)"
          }

          foreach ($entry in $expectedFiles) {
            $path = Join-Path $package $entry.name
            $item = Get-Item $path
            $actualHash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $entry.sha256 -or $item.Length -ne $entry.size) {
              throw "Downloaded artifact differs from the build output: $($entry.name)"
            }
            "$actualHash  $($entry.name)  $($item.Length) bytes" | Add-Content artifacts/redownloaded-sha256.txt -Encoding ascii
          }

          $checksumPath = Join-Path $package 'SHA256SUMS'
          $checksums = @{}
          Get-Content $checksumPath | ForEach-Object {
            if ($_ -notmatch '^([0-9a-f]{64})\s+(.+)$') { throw "Invalid checksum line: $_" }
            $name = $Matches[2].Trim()
            if ($checksums.ContainsKey($name)) { throw "Duplicate checksum entry: $name" }
            $checksums[$name] = $Matches[1]
          }
          if ($checksums.Count -ne 4) { throw "SHA256SUMS must contain exactly four entries, found $($checksums.Count)." }
          $expectedChecksumNames = @(
            'kaito.exe',
            "kaito-installer-$env:KAITO_VERSION.exe",
            'kaito-sbom.cdx.json',
            'RELEASE-METADATA.json'
          ) | Sort-Object
          $actualChecksumNames = @($checksums.Keys | Sort-Object)
          $checksumNameDifference = @(Compare-Object -ReferenceObject $expectedChecksumNames -DifferenceObject $actualChecksumNames)
          if ($checksumNameDifference.Count -gt 0) {
            throw "SHA256SUMS file set is incorrect: $($checksumNameDifference | Out-String)"
          }
          foreach ($entry in $checksums.GetEnumerator()) {
            $path = Join-Path $package $entry.Key
            if (-not (Test-Path $path -PathType Leaf)) { throw "Checksummed file is missing: $($entry.Key)" }
            $actualHash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $entry.Value) { throw "Checksum verification failed: $($entry.Key)" }
          }

          $metadataPath = Join-Path $package 'RELEASE-METADATA.json'
          $metadata = Get-Content $metadataPath -Raw | ConvertFrom-Json
          if (
            $metadata.schema_version -ne 1 -or
            $metadata.rehearsal -ne $true -or
            $metadata.version -ne $env:KAITO_VERSION -or
            $metadata.tag -ne $env:KAITO_REHEARSAL_TAG -or
            $metadata.commit -ne $env:KAITO_REHEARSAL_COMMIT
          ) {
            throw 'Release metadata does not match the rehearsal context.'
          }
          if (
            $metadata.signing.mode -ne 'required' -or
            $metadata.signing.result -ne 'signed' -or
            $metadata.signing.verification_mode -ne 'test-untrusted'
          ) {
            throw 'Release metadata does not record the required rehearsal signing state.'
          }
          $expectedThumbprint = [string]$metadata.signing.certificate.thumbprint
          if ([string]::IsNullOrWhiteSpace($expectedThumbprint)) { throw 'Release metadata certificate thumbprint is missing.' }
          if ($metadata.signing.certificate.subject -ne 'CN=kaito CI signing test') {
            throw 'Release metadata certificate identity is invalid.'
          }
          $notBefore = [DateTimeOffset]::Parse([string]$metadata.signing.certificate.not_before)
          $notAfter = [DateTimeOffset]::Parse([string]$metadata.signing.certificate.not_after)
          $now = [DateTimeOffset]::UtcNow
          if (($notAfter - $notBefore).TotalDays -gt 3) { throw 'Rehearsal certificate lifetime exceeds three days.' }
          if ($notBefore -gt $now.AddMinutes(5) -or $notAfter -le $now) {
            throw 'Rehearsal certificate is not currently valid.'
          }

          $metadataAssets = @($metadata.assets)
          if ($metadataAssets.Count -ne 3) { throw "Release metadata must describe exactly three assets, found $($metadataAssets.Count)." }
          $expectedMetadataAssetNames = @(
            'kaito.exe',
            "kaito-installer-$env:KAITO_VERSION.exe",
            'kaito-sbom.cdx.json'
          ) | Sort-Object
          $actualMetadataAssetNames = @($metadataAssets | ForEach-Object { $_.name } | Sort-Object)
          $metadataNameDifference = @(Compare-Object -ReferenceObject $expectedMetadataAssetNames -DifferenceObject $actualMetadataAssetNames)
          if ($metadataNameDifference.Count -gt 0) {
            throw "Release metadata asset set is incorrect: $($metadataNameDifference | Out-String)"
          }
          foreach ($asset in $metadataAssets) {
            $path = Join-Path $package $asset.name
            if (-not (Test-Path $path -PathType Leaf)) { throw "Metadata asset is missing: $($asset.name)" }
            $item = Get-Item $path
            $actualHash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $asset.sha256 -or $item.Length -ne $asset.size) {
              throw "Metadata asset identity mismatch: $($asset.name)"
            }
          }

          $sbom = Get-Content (Join-Path $package 'kaito-sbom.cdx.json') -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne 'CycloneDX' -or $sbom.specVersion -ne '1.6') {
            throw 'Rehearsal SBOM is not CycloneDX 1.6.'
          }
          $sbomRoot = $sbom.metadata.component
          if ($sbomRoot.name -ne 'kaito' -or $sbomRoot.version -ne $env:KAITO_VERSION) {
            throw 'Rehearsal SBOM root component does not match the project version.'
          }
          $sourceCommit = @($sbomRoot.properties | Where-Object { $_.name -eq 'kaito:source-commit' })
          if ($sourceCommit.Count -ne 1 -or $sourceCommit[0].value -ne $env:KAITO_REHEARSAL_COMMIT) {
            throw 'Rehearsal SBOM source commit does not match the build commit.'
          }
          $sevenZip = @($sbom.components | Where-Object { $_.name -eq '7-Zip' -and $_.version -eq '26.02' })
          if ($sevenZip.Count -ne 1) { throw 'Rehearsal SBOM does not contain exactly one bundled 7-Zip 26.02 component.' }
          Get-Content bundled/SHA256SUMS | ForEach-Object {
            if ($_ -notmatch '^([0-9a-f]{64})\s+(.+)$') { throw "Invalid bundled checksum line: $_" }
            $expectedHash = $Matches[1]
            $bundledName = $Matches[2].Trim()
            $propertyName = "kaito:bundled-file:${bundledName}:sha256"
            $property = @($sevenZip[0].properties | Where-Object { $_.name -eq $propertyName })
            if ($property.Count -ne 1 -or $property[0].value -ne $expectedHash) {
              throw "Rehearsal SBOM checksum mismatch for bundled file: $bundledName"
            }
          }

          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signTool = @(
            (Join-Path $sdkRoot 'x64\signtool.exe')
            Get-ChildItem $sdkRoot -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' }
          ) | Where-Object { Test-Path $_ -PathType Leaf } | Sort-Object -Descending | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($signTool)) { throw 'signtool.exe was not found.' }

          foreach ($binaryName in @('kaito.exe', "kaito-installer-$env:KAITO_VERSION.exe")) {
            $binaryPath = Join-Path $package $binaryName
            $verifyLines = @(& $signTool 'verify' '/pa' '/all' '/v' $binaryPath 2>&1)
            $verifyExitCode = $LASTEXITCODE
            $verifyText = ($verifyLines | ForEach-Object { $_.ToString() }) -join "`n"
            $verifyText | Set-Content (Join-Path artifacts "signtool-$binaryName.txt") -Encoding utf8
            $verifyNormalized = $verifyText -replace '\s+', ' '
            $untrustedRootConfirmed = $false
            if ($verifyExitCode -ne 0) {
              $untrustedRootPattern = '(?i)(0x800B0109|CERT_E_UNTRUSTEDROOT|terminated in a root certificate which is not trusted|root certificate.*not trusted)'
              if ($verifyNormalized -notmatch $untrustedRootPattern) {
                throw "SignTool verification failed with an unexpected error for ${binaryName}: $verifyText"
              }
              $untrustedRootConfirmed = $true
            }

            $signature = Get-AuthenticodeSignature $binaryPath
            if ($null -eq $signature.SignerCertificate) { throw "Embedded signer certificate is missing: $binaryName" }
            if (
              $signature.SignerCertificate.Subject -ne 'CN=kaito CI signing test' -or
              $signature.SignerCertificate.Issuer -ne $signature.SignerCertificate.Subject -or
              ($signature.SignerCertificate.NotAfter - $signature.SignerCertificate.NotBefore).TotalDays -gt 3
            ) {
              throw "Embedded rehearsal certificate identity is invalid: $binaryName"
            }
            if (-not [string]::Equals(
              $signature.SignerCertificate.Thumbprint,
              $expectedThumbprint,
              [System.StringComparison]::OrdinalIgnoreCase
            )) {
              throw "Embedded signer certificate does not match release metadata: $binaryName"
            }
            $signatureStatus = $signature.Status.ToString()
            if ($untrustedRootConfirmed) {
              if ($signatureStatus -notin @('NotTrusted', 'UnknownError')) {
                throw "Unexpected Authenticode status for untrusted rehearsal certificate: $binaryName $signatureStatus"
              }
            }
            elseif ($signatureStatus -ne 'Valid') {
              throw "Authenticode verification failed: $binaryName $signatureStatus"
            }
          }

          [ordered]@{
            schema_version = 1
            result = 'passed'
            version = $env:KAITO_VERSION
            tag = $env:KAITO_REHEARSAL_TAG
            commit = $env:KAITO_REHEARSAL_COMMIT
            file_count = $actualFiles.Count
            signing_result = $metadata.signing.result
            certificate_thumbprint = $expectedThumbprint
          } | ConvertTo-Json -Depth 5 | Set-Content 'artifacts/rehearsal-verification-summary.json' -Encoding utf8

      - name: Upload rehearsal verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaito-release-rehearsal-verification-evidence
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/
