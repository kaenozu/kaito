name: Patch GUI metadata once

on:
  push:
    branches: ["feature/archive-redesign"]
    paths: [".github/workflows/patch-gui-once.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/archive-redesign

      - name: Apply guarded replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/kaito/gui/unzip_app.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '__version__ = "0.9.1.dev0"\n\n',
                  '',
              ),
              (
                  '    ExtractionOptions,\n)\nfrom kaito.settings import SettingsManager\n',
                  '    ExtractionOptions,\n    SafetyLimits,\n)\nfrom kaito.settings import SettingsManager\nfrom kaito.version import __version__\n',
              ),
              (
                  '        # サービス層\n        self._archive_service = ArchiveService()\n',
                  '        # 設定とサービス層\n'
                  '        self._settings = SettingsManager()\n'
                  '        self._archive_service = ArchiveService(\n'
                  '            safety_limits=SafetyLimits(\n'
                  '                max_entries=int(self._settings.get("safety_max_entries")),\n'
                  '                max_total_size=int(self._settings.get("safety_max_total_size")),\n'
                  '                max_single_file_size=int(\n'
                  '                    self._settings.get("safety_max_file_size")\n'
                  '                ),\n'
                  '                max_compression_ratio=float(\n'
                  '                    self._settings.get("safety_max_compression_ratio")\n'
                  '                ),\n'
                  '                max_path_length=int(\n'
                  '                    self._settings.get("safety_max_path_length")\n'
                  '                ),\n'
                  '            )\n'
                  '        )\n',
              ),
              (
                  '        self._build_ui()\n\n        self._settings = SettingsManager()\n\n        self._apply_tree_style()\n',
                  '        self._build_ui()\n\n        self._apply_tree_style()\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"guarded replacement expected once, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kaito/gui/unzip_app.py
          git diff --cached --check
          git commit -m "fix: use package version and configured safety limits in GUI"
          git push origin HEAD:feature/archive-redesign
