name: Format archive productivity suite

on:
  push:
    branches:
      - agent/archive-productivity-suite
    paths:
      - .github/workflows/format-productivity-suite.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Apply Ruff formatting
        run: uv run --frozen ruff format .
      - name: Verify lint
        run: uv run --frozen ruff check .
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Format archive productivity suite"
          git push origin "HEAD:${GITHUB_REF_NAME}"
