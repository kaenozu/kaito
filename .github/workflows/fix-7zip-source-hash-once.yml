name: Fix 7-Zip source hash once

on:
  push:
    branches: [feature/archive-redesign]
    paths: [tools/fix-7zip-source-hash.trigger]

permissions:
  contents: write

jobs:
  fix-hash:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feature/archive-redesign
      - name: Download, verify signature, and fix digest
        shell: pwsh
        run: |
          $url = 'https://github.com/ip7z/7zip/releases/download/26.02/7z2602-x64.exe'
          $package = Join-Path $env:RUNNER_TEMP '7z2602-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $package -UseBasicParsing
          $signature = Get-AuthenticodeSignature $package
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch 'Igor Pavlov') {
            throw "Unexpected signer: $($signature.SignerCertificate.Subject)"
          }
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw "Invalid digest: $hash" }

          $scriptPath = 'tools/update_7zip.ps1'
          $script = Get-Content $scriptPath -Raw
          $marker = '__SET_BY_VERIFIED_WORKFLOW__'
          if (($script.Split($marker).Count - 1) -ne 1) {
            throw 'Unexpected source-hash marker count'
          }
          $script = $script.Replace($marker, $hash)
          Set-Content $scriptPath $script -Encoding utf8
          @(
            "Source: $url"
            "Signer: $($signature.SignerCertificate.Subject)"
            "SHA-256: $hash"
          ) | Set-Content 'bundled/SOURCE-PACKAGE.txt' -Encoding utf8

          git rm tools/fix-7zip-source-hash.trigger .github/workflows/fix-7zip-source-hash-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/update_7zip.ps1 bundled/SOURCE-PACKAGE.txt
          git commit -m 'build: pin signed 7-Zip source package digest'
          git push origin HEAD:feature/archive-redesign
