name: Release PR fixed-head gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter VERIFY_FIXED_PR_GATE exactly
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: number
      expected_head:
        description: Fixed 40-character PR HEAD SHA
        required: true
        type: string
      expected_base_sha:
        description: Fixed 40-character current master SHA
        required: true
        type: string
      expected_ahead:
        description: Expected commits ahead of master
        required: true
        type: number
      expected_files:
        description: Comma-separated exact changed-file paths
        required: true
        type: string
      required_workflows:
        description: Comma-separated required workflow names
        required: true
        default: CI,Release hardening checks,Release rehearsal
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: release-pr-fixed-head-gate-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  verify-fixed-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GATE_CONFIRMATION: ${{ inputs.confirmation }}
      GATE_PR_NUMBER: ${{ inputs.pr_number }}
      GATE_EXPECTED_HEAD: ${{ inputs.expected_head }}
      GATE_EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
      GATE_EXPECTED_AHEAD: ${{ inputs.expected_ahead }}
      GATE_EXPECTED_FILES: ${{ inputs.expected_files }}
      GATE_REQUIRED_WORKFLOWS: ${{ inputs.required_workflows }}

    steps:
      - name: Require exact operator confirmation
        shell: bash
        run: |
          if [[ "$GATE_CONFIRMATION" != "VERIFY_FIXED_PR_GATE" ]]; then
            echo "The confirmation phrase is incorrect." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Verify fixed-head audit gate
        shell: bash
        run: |
          mkdir -p artifacts
          uv run --frozen python tools/verify_pr_approval_gate.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$GATE_PR_NUMBER" \
            --expected-head "$GATE_EXPECTED_HEAD" \
            --expected-base-ref master \
            --expected-base-sha "$GATE_EXPECTED_BASE_SHA" \
            --expected-ahead "$GATE_EXPECTED_AHEAD" \
            --expected-behind 0 \
            --expected-files "$GATE_EXPECTED_FILES" \
            --required-workflows "$GATE_REQUIRED_WORKFLOWS" \
            --output artifacts/release-pr-fixed-head-gate.json

      - name: Upload fixed-head gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaito-release-pr-fixed-head-gate
          if-no-files-found: error
          path: artifacts/release-pr-fixed-head-gate.json
