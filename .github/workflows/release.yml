name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: windows-latest

    steps:
      # actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 -- v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4e3e728b72 -- v5.3.0
      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4e3e728b72

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src/

      - name: Format check
        run: uv run ruff format --check src/

      - name: Type check
        run: uv run pyright src/

      - name: Test (all)
        run: uv run pytest -v

      - name: Build EXE
        run: uv run pyinstaller --clean --noconfirm build.spec

      - name: Smoke test EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/kaito.exe")) {
            Write-Error "kaito.exe not found"
            exit 1
          }
          $v = & "dist/kaito.exe" --version
          if (-not ($v -match "kaito")) { exit 1 }
          $st = & "dist/kaito.exe" --self-test 2>&1
          if (-not ($st -match "All checks passed")) { exit 1 }

      # softprops/action-gh-release@a929a66e1e0e1b1e56bf3fd6b0b1bdbdffb6b021 -- v2.1.0
      - name: Upload release asset
        uses: softprops/action-gh-release@a929a66e1e0e1b1e56bf3fd6b0b1bdbdffb6b021
        with:
          files: dist/kaito.exe