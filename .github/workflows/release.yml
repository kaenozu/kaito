name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-build-release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4e3e728b72 # v5.3.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $projectVersion = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($projectVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match pyproject version $projectVersion"
          }
          if ($projectVersion -match '(dev|a|b|rc)') {
            throw "Prerelease version cannot be published by the stable release workflow: $projectVersion"
          }

      - name: Verify bundled 7-Zip checksums
        shell: pwsh
        run: |
          Get-Content bundled/SHA256SUMS | ForEach-Object {
            if ($_ -match '^([0-9a-f]{64})\s+(.+)$') {
              $expected = $Matches[1]
              $path = Join-Path bundled $Matches[2]
              $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $expected) { throw "Hash mismatch for $path: $actual" }
            }
          }

      - name: Quality gates
        shell: pwsh
        run: |
          uv run ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pyright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pytest -ra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build executable
        run: uv run pyinstaller --clean --noconfirm build.spec

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/kaito.exe'
          $selfTest = & $exe --self-test 2>&1
          if ($LASTEXITCODE -ne 0 -or $selfTest -notmatch 'All checks passed') {
            throw "Self-test failed: $selfTest"
          }
          $info = ((& $exe --backend-info --json) -join "`n") | ConvertFrom-Json
          if ($info.source -ne 'bundled' -or $info.version -ne '26.02' -or $info.integrity -ne 'ok') {
            throw "Backend verification failed: $($info | ConvertTo-Json -Compress)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and smoke-test installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $iscc 'installer/kaito.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

          $installer = (Get-ChildItem 'dist/kaito-installer-*.exe' | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'kaito release verification'
          $installLog = Join-Path $env:RUNNER_TEMP 'kaito-release-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'kaito-release-uninstall.log'
          $installArgs = @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER',
            "/DIR=`"$installDir`"", "/LOG=`"$installLog`""
          )
          $install = Start-Process $installer -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }

          $installedExe = Join-Path $installDir 'kaito.exe'
          $info = ((& $installedExe --backend-info --json) -join "`n") | ConvertFrom-Json
          if ($info.source -ne 'bundled' -or $info.integrity -ne 'ok') {
            throw 'Installed backend verification failed'
          }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstallArgs = @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/LOG=`"$uninstallLog`""
          )
          $uninstall = Start-Process $uninstaller -ArgumentList $uninstallArgs -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }

          "KAITO_INSTALLER=$installer" | Out-File $env:GITHUB_ENV -Append

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @('dist/kaito.exe', $env:KAITO_INSTALLER)
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content 'dist/SHA256SUMS' -Encoding ascii

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@a929a66e1e0e1b1e56bf3fd6b0b1bdbdffb6b021 # v2.1.0
        with:
          files: |
            dist/kaito.exe
            dist/kaito-installer-*.exe
            dist/SHA256SUMS
