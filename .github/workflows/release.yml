name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Build exe
        run: uv run pyinstaller --onefile --windowed --name "kaito" --add-data ".venv/Lib/site-packages/customtkinter;customtkinter/" --hidden-import "tkinterdnd2" --collect-all "tkinterdnd2" src/kaito/gui/unzip_app.py

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kaito.exe
