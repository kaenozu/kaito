name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-build-release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $projectVersion = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($projectVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match pyproject version $projectVersion"
          }
          if ($projectVersion -match '(dev|a|b|rc)') {
            throw "Prerelease version cannot be published by the stable release workflow: $projectVersion"
          }

      - name: Verify bundled 7-Zip checksums
        shell: pwsh
        run: |
          Get-Content bundled/SHA256SUMS | ForEach-Object {
            if ($_ -match '^([0-9a-f]{64})\s+(.+)$') {
              $expected = $Matches[1]
              $name = $Matches[2].Trim()
              $path = Join-Path bundled $name
              if (-not (Test-Path $path)) { throw "Missing bundled file: $path" }
              $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $expected) { throw "Hash mismatch for $path: $actual" }
            }
          }

      - name: Quality gates
        shell: pwsh
        run: |
          uv run ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pyright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pytest -ra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build executable
        run: uv run pyinstaller --clean --noconfirm build.spec

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/kaito.exe').Path
          $versionFile = Join-Path $env:RUNNER_TEMP 'release-version.txt'
          $selfTestFile = Join-Path $env:RUNNER_TEMP 'release-self-test.txt'
          $backendFile = Join-Path $env:RUNNER_TEMP 'release-backend.json'

          $process = Start-Process -FilePath $exe -ArgumentList @('--version', '--output', $versionFile) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Version process failed: $($process.ExitCode)" }
          $version = Get-Content $versionFile -Raw
          if ($version -notmatch '^kaito ') { throw "Version output failed: $version" }

          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--output', $selfTestFile) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Self-test process failed: $($process.ExitCode)" }
          $selfTest = Get-Content $selfTestFile -Raw
          if ($selfTest -notmatch 'All checks passed') { throw "Self-test failed: $selfTest" }

          $process = Start-Process -FilePath $exe -ArgumentList @('--backend-info', '--json', '--output', $backendFile) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Backend-info process failed: $($process.ExitCode)" }
          $info = (Get-Content $backendFile -Raw) | ConvertFrom-Json
          if ($info.source -ne 'bundled' -or $info.version -ne '26.02' -or $info.integrity -ne 'ok' -or $info.sha256 -ne $info.expected_sha256) {
            throw "Backend verification failed: $($info | ConvertTo-Json -Compress)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and smoke-test installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc 'installer/kaito.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

          $installer = (Get-ChildItem 'dist/kaito-installer-*.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Installer output not found' }
          $installDir = Join-Path $env:RUNNER_TEMP 'kaito release 検証'
          $installLog = Join-Path $env:RUNNER_TEMP 'kaito-release-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'kaito-release-uninstall.log'
          $installedSelfTestFile = Join-Path $env:RUNNER_TEMP 'installed-self-test.txt'
          $installedBackendFile = Join-Path $env:RUNNER_TEMP 'installed-backend.json'

          $installArgs = @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER',
            "/DIR=`"$installDir`"", "/LOG=`"$installLog`""
          )
          $install = Start-Process $installer -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }

          $installedExe = Join-Path $installDir 'kaito.exe'
          foreach ($required in @(
            $installedExe,
            (Join-Path $installDir 'LICENSE'),
            (Join-Path $installDir 'SECURITY.md'),
            (Join-Path $installDir 'THIRD_PARTY_NOTICES.md'),
            (Join-Path $installDir 'licenses/7-ZIP-LICENSE.txt'),
            (Join-Path $installDir 'licenses/SHA256SUMS')
          )) {
            if (-not (Test-Path $required)) { throw "Installed file missing: $required" }
          }

          $process = Start-Process -FilePath $installedExe -ArgumentList @('--self-test', '--output', $installedSelfTestFile) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed self-test process failed: $($process.ExitCode)" }
          if ((Get-Content $installedSelfTestFile -Raw) -notmatch 'All checks passed') { throw 'Installed self-test failed' }

          $process = Start-Process -FilePath $installedExe -ArgumentList @('--backend-info', '--json', '--output', $installedBackendFile) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed backend-info process failed: $($process.ExitCode)" }
          $info = (Get-Content $installedBackendFile -Raw) | ConvertFrom-Json
          if ($info.source -ne 'bundled' -or $info.integrity -ne 'ok') { throw 'Installed backend verification failed' }

          $extractKeys = @('.zip', '.rar', '.7z') | ForEach-Object {
            "HKCU:\Software\Classes\SystemFileAssociations\$_\shell\kaito_extract"
          }
          foreach ($key in $extractKeys) {
            if (-not (Test-Path $key)) { throw "Context-menu key missing: $key" }
          }
          if (Test-Path 'HKCU:\Software\Classes\SystemFileAssociations\.txt\shell\kaito_extract') {
            throw 'Extract action must not be registered for .txt'
          }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstallArgs = @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/LOG=`"$uninstallLog`""
          )
          $uninstall = Start-Process $uninstaller -ArgumentList $uninstallArgs -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 2
          foreach ($key in $extractKeys) {
            if (Test-Path $key) { throw "Context-menu key remained after uninstall: $key" }
          }

          "KAITO_INSTALLER=$installer" | Out-File $env:GITHUB_ENV -Append

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @('dist/kaito.exe', $env:KAITO_INSTALLER)
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content 'dist/SHA256SUMS' -Encoding ascii

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/kaito.exe
            dist/kaito-installer-*.exe
            dist/SHA256SUMS
