name: One-time finalize release candidate

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/one-time-finalize-release-candidate.yml
      - .github/scripts/finalize_release_candidate.py
      - .github/workflows/release-publish.yml
      - tools/create_draft_release.ps1
      - tools/test_upgrade.ps1
      - tests/test_release_workflow_policy.py
      - docs/RELEASE_PUBLICATION.md

permissions:
  contents: write

concurrency:
  group: one-time-finalize-release-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify exact triggering PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED_HEAD" ]; then
            echo "Unexpected checkout: expected=$EXPECTED_HEAD actual=$actual" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Apply deterministic repository migration
        run: python .github/scripts/finalize_release_candidate.py

      - name: Refresh and verify lockfile
        run: |
          uv lock
          uv lock --check
          uv sync --frozen

      - name: Validate Python, PowerShell, YAML, and release policies
        shell: bash
        run: |
          python -m py_compile .github/scripts/finalize_release_candidate.py tests/test_release_workflow_policy.py
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/create_draft_release.ps1", [ref]$null, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/test_upgrade.ps1", [ref]$null, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }'
          uv run --with pyyaml python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY
          uv run --frozen pytest -q tests/test_release_workflow_policy.py tests/test_release_operations_policy.py tests/test_production_signing_workflow_policy.py

      - name: Remove one-time migration machinery
        run: |
          git rm .github/scripts/finalize_release_candidate.py
          git rm .github/workflows/one-time-finalize-release-candidate.yml

      - name: Commit final tree and fast-forward PR branch
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git config user.name 'release-finalizer[bot]'
          git config user.email 'release-finalizer[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'finalize v0.12.0 release candidate'
          git fetch origin "$PR_BRANCH"
          actual=$(git rev-parse FETCH_HEAD)
          if [ "$actual" != "$EXPECTED_HEAD" ]; then
            echo "PR branch moved: expected=$EXPECTED_HEAD actual=$actual" >&2
            exit 1
          fi
          git push origin "HEAD:$PR_BRANCH"
          git push origin --delete agent/release-finalize-staging || true
