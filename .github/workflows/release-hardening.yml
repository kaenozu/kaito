name: Release hardening checks

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-hardening.yml"
      - "tools/sign_windows.ps1"
      - "tools/test_sign_windows.ps1"
      - "tools/generate_sbom.py"
      - "tests/test_generate_sbom.py"
  push:
    branches: [master]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-hardening.yml"
      - "tools/sign_windows.ps1"
      - "tools/test_sign_windows.ps1"
      - "tools/generate_sbom.py"
      - "tests/test_generate_sbom.py"

permissions:
  contents: read

jobs:
  signing-and-sbom:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Test Windows signing modes and certificate validation
        shell: pwsh
        run: ./tools/test_sign_windows.ps1 -ArtifactsDir artifacts/signing-tests

      - name: Test and generate CycloneDX SBOM
        shell: pwsh
        run: |
          uv run --frozen pytest -q tests/test_generate_sbom.py
          uv run --frozen python tools/generate_sbom.py `
            --repository-root . `
            --output artifacts/kaito-sbom.cdx.json `
            --commit $env:GITHUB_SHA
          Get-Content artifacts/kaito-sbom.cdx.json -Raw | ConvertFrom-Json | Out-Null

      - name: Upload hardening evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaito-release-hardening-evidence
          if-no-files-found: warn
          path: artifacts/
