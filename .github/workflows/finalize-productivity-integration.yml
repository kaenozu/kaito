name: Finalize archive productivity integration

on:
  push:
    branches:
      - agent/archive-productivity-suite
    paths:
      - .github/workflows/finalize-productivity-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Apply focused integration patches
        shell: python
        run: |
          from pathlib import Path

          def require_once(text: str, marker: str, path: str) -> None:
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}: {marker!r}")

          # Programmatic context-menu installation and removal.
          path = Path("src/kaito/gui/unzip_app.py")
          text = path.read_text(encoding="utf-8")
          install_marker = "    # 圧縮: ファイル・フォルダ\n"
          require_once(text, install_marker, str(path))
          test_install = '''    # 整合性検査: 対応拡張子のみ\n    for ext in _CONTEXT_EXTENSIONS:\n        key_path = f"{base}\\\\SystemFileAssociations\\\\{ext}\\\\shell\\\\kaito_test"\n        with CreateKeyEx(HKEY_CURRENT_USER, key_path, 0, KEY_SET_VALUE) as key:\n            SetValueEx(key, None, 0, REG_SZ, "kaitoで整合性を検査")\n        cmd_path = f"{key_path}\\\\command"\n        with CreateKeyEx(HKEY_CURRENT_USER, cmd_path, 0, KEY_SET_VALUE) as key:\n            SetValueEx(key, None, 0, REG_SZ, f'{exe_str} --test-archive "%1"')\n\n'''
          text = text.replace(install_marker, test_install + install_marker, 1)

          uninstall_start = text.index("def uninstall_context_menu() -> None:")
          uninstall_text = text[uninstall_start:]
          uninstall_marker = '    for shell_root in [f"{base}\\\\*", f"{base}\\\\Directory"]:\n'
          require_once(uninstall_text, uninstall_marker, str(path))
          test_uninstall = '''    for ext in _CONTEXT_EXTENSIONS:\n        _delete_key_recursive(\n            HKEY_CURRENT_USER,\n            f"{base}\\\\SystemFileAssociations\\\\{ext}\\\\shell\\\\kaito_test",\n        )\n\n'''
          uninstall_text = uninstall_text.replace(
              uninstall_marker, test_uninstall + uninstall_marker, 1
          )
          path.write_text(text[:uninstall_start] + uninstall_text, encoding="utf-8")

          # Installer lifecycle test covers the new registry action.
          path = Path("tools/test_installer.ps1")
          text = path.read_text(encoding="utf-8")
          marker = "$CompressKeys = @(\n"
          require_once(text, marker, str(path))
          test_keys = '''$TestKeys = @('.zip', '.rar', '.7z') | ForEach-Object {\n    "HKCU:\\Software\\Classes\\SystemFileAssociations\\$_\\shell\\kaito_test"\n}\n'''
          text = text.replace(marker, test_keys + marker, 1)
          combined = "($ExtractKeys + $CompressKeys)"
          if combined not in text:
              raise SystemExit("tools/test_installer.ps1: combined registry loop missing")
          text = text.replace(combined, "($ExtractKeys + $TestKeys + $CompressKeys)")
          path.write_text(text, encoding="utf-8")

          # Stable-release guards and optional code signing.
          path = Path(".github/workflows/release.yml")
          text = path.read_text(encoding="utf-8")
          version_marker = '''          if ($projectVersion -match '(dev|a|b|rc)') {\n            throw "Prerelease version cannot be published by the stable release workflow: $projectVersion"\n          }\n          "KAITO_VERSION=$projectVersion" | Out-File $env:GITHUB_ENV -Append\n'''
          require_once(text, version_marker, str(path))
          version_replacement = '''          if ($projectVersion -match '(dev|a|b|rc)') {\n            throw "Prerelease version cannot be published by the stable release workflow: $projectVersion"\n          }\n          if (-not (Select-String -Path CHANGELOG.md -Pattern ([regex]::Escape("[$projectVersion]")) -Quiet)) {\n            throw "CHANGELOG.md does not contain a [$projectVersion] section"\n          }\n          git fetch origin master --depth=1\n          $tagCommit = (git rev-parse HEAD).Trim()\n          $masterCommit = (git rev-parse origin/master).Trim()\n          if ($tagCommit -ne $masterCommit) {\n            throw "Stable tags must point to the current master head: tag=$tagCommit master=$masterCommit"\n          }\n          "KAITO_VERSION=$projectVersion" | Out-File $env:GITHUB_ENV -Append\n'''
          text = text.replace(version_marker, version_replacement, 1)

          verify_marker = "      - name: Verify executable\n"
          require_once(text, verify_marker, str(path))
          sign_exe = '''      - name: Sign executable when a certificate is configured\n        shell: pwsh\n        env:\n          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}\n          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}\n        run: ./tools/sign_windows.ps1 -FilePath 'dist/kaito.exe'\n\n'''
          text = text.replace(verify_marker, sign_exe + verify_marker, 1)

          installer_test_marker = "      - name: Test install, registry integration, and uninstall\n"
          require_once(text, installer_test_marker, str(path))
          sign_installer = '''      - name: Sign installer when a certificate is configured\n        shell: pwsh\n        env:\n          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}\n          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}\n        run: ./tools/sign_windows.ps1 -FilePath $env:KAITO_INSTALLER\n\n'''
          text = text.replace(
              installer_test_marker, sign_installer + installer_test_marker, 1
          )
          path.write_text(text, encoding="utf-8")

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kaito/gui/unzip_app.py tools/test_installer.ps1 .github/workflows/release.yml
          git commit -m "Finalize Explorer and release integration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
