name: Verify

# ローカル作業（feature/ui-i18n-worker 等）を origin/master へ統合するための
# 軽量検証ゲート。テスト・pyright・ruff・フォント実測監査・モックテーマ突合のみ実行し、
# アーキテクチャに依存しない（patool ベースの旧ブランチでも 7z.dll ベースの
# master でも動作する）。
# master 統合後は origin/master の ci.yml（ビルド・インストーラ・GUI acceptance
# を含む本格CI）が担うため、本ワークフローは feature ブランチと PR のみで実行する。

on:
  push:
    branches: ["feature/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Prepare artifacts directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path artifacts -Force | Out-Null

      - name: Lint
        shell: pwsh
        run: |
          $output = & uv run --frozen ruff check . 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/ruff-check.txt
          exit $code

      - name: Format check
        shell: pwsh
        run: |
          $output = & uv run --frozen ruff format --check . 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/ruff-format.txt
          exit $code

      - name: Type check
        shell: pwsh
        run: |
          $output = & uv run --frozen pyright 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/pyright-output.txt
          exit $code

      - name: Test
        shell: pwsh
        run: |
          $output = & uv run --frozen pytest -ra --junitxml=artifacts/test-results.xml 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/pytest-output.txt
          exit $code

      # 全 CTk ウィジェットのフォント実測値を Tk に問い合わせて検証する（tools/font_audit.py）。
      # テーマ不変性（フォントはテーマ非依存）と family が Segoe UI であることを固定し、
      # フォントの意図しない変更（CTkFont→ttk の GC フォールバック等）を回帰検知する。
      # 実 Tk ルートが必要なため windows-latest でのみ実行（テストステップも同条件で Tk を使用）。
      - name: Font audit
        shell: pwsh
        run: |
          $output = & uv run --frozen python tools/font_audit.py --no-html 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/font-audit.txt
          exit $code

      # モックの CSS 変数が theme.py のビジュアルトークンと一致しているか検証する
      # （tools/check_mock_theme.py）。index.html を手で書き換えた際にライト/ダークの色が
      # 乖離したり、theme.py に未対応トークンが追加されたりすると exit 1 で落とす。
      # ファイル解析のみで GUI 不要のため、どの runner でも決定的に動作する。
      - name: Mock theme check
        shell: pwsh
        run: |
          $output = & uv run --frozen python tools/check_mock_theme.py 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath artifacts/mock-theme-check.txt
          exit $code

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaito-verify
          if-no-files-found: warn
          path: artifacts/
