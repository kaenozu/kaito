name: Apply GUI patch once

on:
  push:
    branches: [feature/archive-redesign]
    paths: [tools/apply-gui-patch.trigger]

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feature/archive-redesign
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Apply patch and verify
        shell: pwsh
        run: |
          uv run python tools/apply_gui_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format src/kaito/gui/unzip_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff check src/kaito/gui/unzip_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pyright src/kaito/gui/unzip_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rm tools/apply_gui_patch.py tools/apply-gui-patch.trigger .github/workflows/apply-gui-patch-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden GUI password, cancellation, and shutdown flow'
          git push origin HEAD:feature/archive-redesign
