name: Patch CI version check

on:
  push:
    branches:
      - feature/archive-redesign
    paths:
      - .github/workflows/patch-ci-version.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Replace hard-coded version assertion
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          old = """          $version = Get-Content $versionFile -Raw
          if ($version.Trim() -ne 'kaito 0.10.0.dev0') { throw \"Version check failed: $version\" }
"""
          new = """          $version = Get-Content $versionFile -Raw
          $projectVersion = uv run --frozen python -c \"import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])\"
          if ($version.Trim() -ne \"kaito $projectVersion\") { throw \"Version check failed: $version\" }
"""
          if old not in text:
              raise SystemExit('Expected hard-coded version block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit CI fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "Make CI version check follow project metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
