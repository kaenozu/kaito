name: Unified review finalizer

on:
  push:
    branches: ["agent/unified-review-release-fixes"]

permissions:
  contents: write

concurrency:
  group: unified-review-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out unified branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/unified-review-release-fixes
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Apply unified corrections
        run: python tools/apply_unified_fixes_once.py

      - name: Verify lockfile and install dependencies
        run: |
          uv lock --check
          uv sync --frozen

      - name: Format and validate source
        shell: pwsh
        run: |
          uv run --frozen ruff format .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen pyright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen pytest -ra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit clean unified tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ((git status --porcelain).Count -eq 0) { throw 'Unified finalizer produced no changes.' }
          git commit -m "refactor: unify release governance and application fixes"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/unified-review-release-fixes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
