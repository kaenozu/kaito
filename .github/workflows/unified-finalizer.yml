name: Unified review finalizer

on:
  push:
    branches: ["agent/unified-review-release-fixes"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: unified-review-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out unified branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/unified-review-release-fixes
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Apply unified corrections
        run: python tools/apply_unified_fixes_once.py

      - name: Verify lockfile and install dependencies
        run: |
          uv lock --check
          uv sync --frozen

      - name: Format and validate source
        shell: pwsh
        run: |
          uv run --frozen ruff format .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen pyright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen pytest -ra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export validated unified tree
        run: python tools/export_unified_tree_once.py

      - name: Upload validated unified tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-unified-tree
          if-no-files-found: error
          include-hidden-files: true
          path: artifacts/unified-tree/
