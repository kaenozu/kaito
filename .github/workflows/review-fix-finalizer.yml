name: Review Fix Finalizer

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.head_ref == 'agent/full-source-review-fixes' &&
      github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Apply deterministic source transformations
        run: uv run --python 3.12 python tools/apply_review_fixes_once.py

      - name: Refresh and verify lockfile
        run: |
          uv lock
          uv lock --check
          uv sync --frozen

      - name: Format and lint changed Python files
        shell: pwsh
        run: |
          $files = @(
            'src/kaito/archive/zip_backend.py',
            'src/kaito/diagnostics.py',
            'src/kaito/gui/productivity.py',
            'src/kaito/gui/unzip_app.py',
            'src/kaito/update_checker.py',
            'tests/test_full_review_fixes.py',
            'tools/apply_review_fixes_once.py'
          )
          uv run --frozen ruff check --fix @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen ruff format @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen ruff check @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Type check
        run: uv run --frozen pyright

      - name: Test
        run: uv run --frozen pytest -ra

      - name: Commit generated and formatted changes
        shell: pwsh
        run: |
          $status = @(git status --porcelain)
          if ($status.Count -eq 0) {
            throw 'The finalizer produced no changes; expected lockfile and source transformations.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock src tests tools
          git commit -m 'fix: finalize full source review remediation [skip ci]'
          git push origin "HEAD:$env:GITHUB_HEAD_REF"
