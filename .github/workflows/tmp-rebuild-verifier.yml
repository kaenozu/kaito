name: Temporary verifier branch rebuild

on:
  push:
    branches:
      - agent/rebuild-unify-release-verification
    paths:
      - .github/workflows/tmp-rebuild-verifier.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/rebuild-unify-release-verification
          fetch-depth: 0
          persist-credentials: true

      - name: Restore exact reviewed verifier files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/archive-unify-release-verification-pre-sync
          git checkout origin/agent/archive-unify-release-verification-pre-sync -- \
            .github/workflows/release-hardening.yml \
            .github/workflows/release-rehearsal.yml \
            .github/workflows/release.yml \
            docs/RELEASE_SECURITY.md \
            tests/test_release_verifier_policy.py \
            tests/test_release_workflow_policy.py \
            tools/test_verify_release_package.ps1 \
            tools/verify_release_package.ps1 \
            tools/verify_release_rehearsal.ps1
          git rm .github/workflows/tmp-rebuild-verifier.yml
          git commit -m "Rebuild shared release verifier on final hardening base"
          git push origin HEAD:agent/rebuild-unify-release-verification
