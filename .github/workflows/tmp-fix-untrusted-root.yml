name: Temporary SignTool output fix

on:
  push:
    branches:
      - agent/release-pipeline-hardening
    paths:
      - .github/workflows/tmp-fix-untrusted-root.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release hardening branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/release-pipeline-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Make untrusted-root detection order independent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/sign_windows.ps1')
          text = path.read_text(encoding='utf-8')
          old = "$untrustedRootPattern = '(?i)(0x800B0109|CERT_E_UNTRUSTEDROOT|terminated in a root certificate which is not trusted|root certificate.*not trusted)'"
          new = "$untrustedRootPattern = '(?is)(0x800B0109|CERT_E_UNTRUSTEDROOT|terminated in a root.*certificate which is not trusted by the trust provider|root certificate.*not trusted)'"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one SignTool pattern, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/tmp-fix-untrusted-root.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sign_windows.ps1 .github/workflows/tmp-fix-untrusted-root.yml
          git commit -m "Handle interleaved SignTool untrusted-root output"
          git push origin HEAD:agent/release-pipeline-hardening
